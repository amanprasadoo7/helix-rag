[project]
name = "helix"
version = "0.1.0"
description = "Helix - permission-aware agentic RAG over the GitLab handbook and docs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.29,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "markdown>=3.7,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pyyaml>=6.0,<7.0",
    "qdrant-client>=1.12,<2.0",
    "redis[hiredis]>=5.0,<9.0",
    "structlog>=24.1,<26.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "types-markdown>=3.7",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "packages" }

[tool.setuptools.packages.find]
where = ["packages"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "integration: requires the local Docker Compose stack",
]

[tool.mypy]
python_version = "3.12"
files = ["packages/helix", "apps"]
ignore_missing_imports = true
warn_unused_ignores = true
